<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AiroBol</title>
    <style>
        /* ФИКСИРУЕМ ГОРИЗОНТАЛЬ */
        * { box-sizing: border-box; }
        body { 
            margin: 0; padding: 0; overflow: hidden; 
            font-family: 'Arial Black', sans-serif; 
            background: #87CEEB; color: white;
        }
        
        /* ФОН - СПЛОШНЫЕ ОБЛАКА */
        .bg-clouds {
            position: fixed; width: 100vw; height: 100vh;
            background: url('https://img.freepik.com');
            background-size: cover; z-index: -1;
        }

        /* ПРОФИЛЬ (ВЕРХНИЙ ЛЕВЫЙ УГОЛ) */
        .profile-box {
            position: absolute; top: 15px; left: 15px;
            display: flex; align-items: center;
            background: rgba(0,0,0,0.4); padding: 8px 15px;
            border-radius: 40px; border: 2px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
        }
        .avatar { width: 45px; height: 45px; border-radius: 50%; background: #ddd; border: 2px solid white; }
        .stats { margin-left: 12px; font-size: 14px; line-height: 1.2; }

        /* КНОПКИ В ЦЕНТРЕ (ГОРИЗОНТАЛЬНО) */
        .main-menu {
            display: flex; align-items: center; justify-content: center;
            height: 100vh; width: 100vw; gap: 40px;
        }
        .circle-btn {
            width: 90px; height: 90px; border-radius: 50%; border: none;
            background: #1E88E5; color: white; font-size: 12px; font-weight: bold;
            cursor: pointer; box-shadow: 0 6px #1565C0;
            display: flex; align-items: center; justify-content: center;
            text-transform: uppercase;
        }
        .btn-play { width: 140px; height: 140px; font-size: 70px; background: #1E88E5; }

        /* ОКНО РЕЖИМОВ */
        #modes {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%; background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px); align-items: center; justify-content: center; gap: 20px;
        }
        .rect-btn {
            width: 200px; height: 90px; border-radius: 30px; border: none;
            background: #1E88E5; color: white; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px #1565C0; font-size: 16px;
        }
        .btn-ranked { background: #FFD700; color: #333; box-shadow: 0 6px #B8860B; }
    </style>
</head>
<body>
    <div class="bg-clouds"></div>

    <div class="profile-box">
        <div class="avatar"></div>
        <div class="stats">
            <b>Bobik</b><br>
            <span style="color:#FFD700">ЭЛО: 0</span><br>
            <small style="opacity:0.7">ID: #7421</small>
        </div>
    </div>

    <div class="main-menu" id="menu">
        <button class="circle-btn" onclick="alert('Скины: Золотой Бобер за 1000 Эло')">СКИНЫ</button>
        <button class="circle-btn btn-play" onclick="toggleModes(true)">»</button>
        <button class="circle-btn" onclick="alert('Настройки: RU/EN')">НАСТР.</button>
    </div>

    <div id="modes">
        <button class="rect-btn" onclick="alert('Бот запущен')">БОТ</button>
        <button class="rect-btn btn-ranked" onclick="alert('Поиск игры...')">РАНГОВЫЙ</button>
        <button class="rect-btn" onclick="alert('Игра с другом')">ДРУГ</button>
        <button onclick="toggleModes(false)" style="position:absolute; bottom:20px; color:white; background:none; border:none; font-size:20px;">← НАЗАД</button>
    </div>

    <script>
        function toggleModes(show) {
            document.getElementById('menu').style.display = show ? 'none' : 'flex';
            document.getElementById('modes').style.display = show ? 'flex' : 'none';
        }
    </script>
</body>
</html>
